{% extends "base.html" %}

{% block title %}Error - TravelGo{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
            <div class="display-1 text-danger mb-4">{{ error_code }}</div>
            <h2 class="mb-3">{{ error_message }}</h2>
            <p class="lead text-muted mb-4">Something went wrong. Let's get you back on track.</p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="/" class="btn btn-primary btn-lg px-4">Go Home</a>
                <a href="javascript:history.back()" class="btn btn-secondary btn-lg px-4">Go Back</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
