{% extends "base.html" %}

{% block title %}Booking Details - TravelGo{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div id="bookingDetails" class="card border-0 shadow">
                <div class="card-body p-4">
                    <div class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3">Loading booking details...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
async function loadBookingDetails() {
    const bookingId = window.location.pathname.split('/').pop();
    
    try {
        const response = await fetch(`/api/bookings/${bookingId}`);
        const result = await response.json();
        
        if (result.success) {
            const booking = result.booking;
            const detailsDiv = document.getElementById('bookingDetails');
            
            const statusBadgeClass = booking.status === 'Confirmed' ? 'bg-success' : 'bg-danger';
            const canCancel = booking.status === 'Confirmed';
            
            detailsDiv.innerHTML = `
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="card-title mb-0">Booking Details</h2>
                        <a href="/dashboard" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Back
                        </a>
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <h5 class="text-muted">Booking Reference</h5>
                            <p class="fs-5 fw-bold">${booking.booking_reference}</p>
                        </div>
                        <div class="col-md-6">
                            <h5 class="text-muted">Status</h5>
                            <p>
                                <span class="badge ${statusBadgeClass} fs-6">${booking.status}</span>
                            </p>
                        </div>
                    </div>
                    
                    <div class="card bg-light mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Journey Information</h5>
                            <div class="row">
                                <div class="col-md-3">
                                    <p class="text-muted small">Type</p>
                                    <p class="fw-bold">${booking.booking_type}</p>
                                </div>
                                <div class="col-md-3">
                                    <p class="text-muted small">From</p>
                                    <p class="fw-bold">${booking.departure_city}</p>
                                </div>
                                <div class="col-md-3">
                                    <p class="text-muted small">To</p>
                                    <p class="fw-bold">${booking.arrival_city}</p>
                                </div>
                                <div class="col-md-3">
                                    <p class="text-muted small">Date</p>
                                    <p class="fw-bold">${booking.travel_date}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card bg-light mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Price Details</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <p class="text-muted small">Total Amount</p>
                                    <p class="fs-4 fw-bold text-primary">$${booking.total_price.toFixed(2)}</p>
                                </div>
                                <div class="col-md-6">
                                    <p class="text-muted small">Booking Date</p>
                                    <p>${new Date(booking.created_at).toLocaleDateString()}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        ${canCancel ? `<div class="col-md-6">
                            <button class="btn btn-danger w-100" onclick="cancelBooking('${booking.booking_id}')">
                                <i class="bi bi-trash"></i> Cancel Booking
                            </button>
                        </div>` : ''}
                        <div class="col-md-6">
                            <a href="/search" class="btn btn-primary w-100">
                                <i class="bi bi-plus-circle"></i> Book Another
                            </a>
                        </div>
                    </div>
                </div>
            `;
        } else {
            document.getElementById('bookingDetails').innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-circle"></i> Booking not found
                </div>
            `;
        }
    } catch (error) {
        console.error('Error:', error);
        document.getElementById('bookingDetails').innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-circle"></i> Error loading booking details
            </div>
        `;
    }
}

async function cancelBooking(bookingId) {
    if (confirm('Are you sure you want to cancel this booking?')) {
        try {
            const response = await fetch(`/api/bookings/${bookingId}`, {
                method: 'DELETE'
            });
            const result = await response.json();
            
            if (result.success) {
                alert('Booking cancelled successfully');
                window.location.href = '/dashboard';
            } else {
                alert(result.message || 'Failed to cancel booking');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred');
        }
    }
}

document.addEventListener('DOMContentLoaded', loadBookingDetails);
</script>
{% endblock %}
