{% extends "base.html" %}

{% block title %}Register - TravelGo{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card border-0 shadow" style="border-radius: 12px; overflow: hidden;">
                <div class="card-header" style="background: linear-gradient(135deg, #DC143C 0%, #B71C1C 100%); color: white; padding: 2rem; border: none;">
                    <h2 class="card-title text-center mb-0" style="font-size: 1.8rem; font-weight: 700;">Join TravelGo</h2>
                    <p class="text-center mb-0" style="opacity: 0.9; font-size: 0.95rem; margin-top: 0.5rem;">Create your account and start exploring</p>
                </div>
                <div class="card-body p-5">
                    <form id="registerForm">
                        <div class="mb-4">
                            <label for="name" class="form-label" style="color: #DC143C; font-weight: 600;">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required style="border: 2px solid #E0E0E0; padding: 0.8rem; border-radius: 8px;">
                        </div>
                        
                        <div class="mb-4">
                            <label for="email" class="form-label" style="color: #DC143C; font-weight: 600;">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required style="border: 2px solid #E0E0E0; padding: 0.8rem; border-radius: 8px;">
                        </div>
                        
                        <div class="mb-4">
                            <label for="phone" class="form-label" style="color: #DC143C; font-weight: 600;">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="+1 (555) 000-0000" required style="border: 2px solid #E0E0E0; padding: 0.8rem; border-radius: 8px;">
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label" style="color: #DC143C; font-weight: 600;">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required style="border: 2px solid #E0E0E0; padding: 0.8rem; border-radius: 8px;">
                            <small style="color: #999;">Minimum 6 characters</small>
                        </div>
                        
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label" style="color: #DC143C; font-weight: 600;">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required style="border: 2px solid #E0E0E0; padding: 0.8rem; border-radius: 8px;">
                        </div>
                        
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label" for="terms" style="color: #666;">
                                I agree to the <span style="color: #DC143C; font-weight: 600;">terms and conditions</span>
                            </label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mb-3" style="padding: 0.9rem; font-weight: 600; border-radius: 8px; font-size: 1.05rem;">
                            <i class="bi bi-person-plus"></i> Create Account
                        </button>
                    </form>
                    
                    <div id="message" class="alert d-none" role="alert"></div>
                    
                    <p class="text-center" style="color: #666;">
                        Already have an account? <a href="/login" style="color: #DC143C; font-weight: 600; text-decoration: none;">Sign in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const messageDiv = document.getElementById('message');
    
    if (password !== confirmPassword) {
        showMessage('Passwords do not match!', 'danger', messageDiv);
        return;
    }
    
    try {
        const response = await fetch('/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                name: name,
                email: email,
                phone: phone,
                password: password
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            showMessage('Registration successful! Redirecting...', 'success', messageDiv);
            setTimeout(() => {
                window.location.href = '/search';
            }, 2000);
        } else {
            showMessage(result.message || 'Registration failed', 'danger', messageDiv);
        }
    } catch (error) {
        console.error('Error:', error);
        showMessage('An error occurred. Please try again.', 'danger', messageDiv);
    }
});

function showMessage(message, type, element) {
    element.textContent = message;
    element.className = `alert alert-${type}`;
    element.classList.remove('d-none');
}
</script>
{% endblock %}
